name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  ENSDF_VERSION: "250902"
  ENSDF_DIST: "dist25"
  ENSDF_PATH: "/tmp/ensdf"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
      - run: uv sync --extra dev --extra test
      - run: uv run ruff check nudel tests
      - run: uv run ruff format --check nudel tests

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
      - run: uv sync --extra dev --extra test
      # pyrefly is informational-only: ~21 pre-existing typing errors remain
      # from a pending typing refactor; do not block CI on them.
      - run: uv run pyrefly check nudel
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = support floor (requires-python>=3.10);
        # 3.13 = current stable; 3.14 = latest as of Oct 2025.
        python-version: ["3.10", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Cache ENSDF data
        id: ensdf-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ENSDF_PATH }}
          key: ensdf-${{ env.ENSDF_VERSION }}
      - name: Download ENSDF
        if: steps.ensdf-cache.outputs.cache-hit != 'true'
        run: |
          wget "https://www.nndc.bnl.gov/ensdfarchivals/distributions/${ENSDF_DIST}/ensdf_${ENSDF_VERSION}.zip"
          mkdir -p "${ENSDF_PATH}"
          unzip "ensdf_${ENSDF_VERSION}.zip" -d "${ENSDF_PATH}"
      - run: uv sync --extra test
      - run: uv run pytest
