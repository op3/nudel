name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  ENSDF_VERSION: "260805"

jobs:
  formal-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --extra dev --extra test
      - run: uv run ruff check nudel tests
      - run: uv run ruff format --check nudel tests
      - run: uv run pyrefly check nudel

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Cache ENSDF data
        id: ensdf-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nudel/ensdf
          key: ensdf-${{ env.ENSDF_VERSION }}
      - name: Fetch ENSDF data
        if: steps.ensdf-cache.outputs.cache-hit != 'true'
        run: uv run python -m nudel.fetch --fetch ${{ env.ENSDF_VERSION }}
      - run: uv sync --extra test
      - run: uv run pytest
